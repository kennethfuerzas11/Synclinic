<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SynClinic</title>
  <script>
    (() => {
      const path = window.location.pathname.replace(/\/+$/, "");
      const target = /\/Synclinic$/i.test(path) ? "../index.html" : "./index.html";
      window.location.replace(new URL(target, window.location.href).toString());
    })();
  </script>
</head>
<body>
  <noscript>
    <p>JavaScript is required to load SynClinic.</p>
  </noscript>
  <p>Redirecting to SynClinic...</p>
</body>
</html>
